<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Check-in Finca KaYu</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* 20-10-2026 b (Bart): rustige kleuren zoals de app. --pine is de inkt; KaYu-roest (--accent) alleen op Versturen en het uitlegkader.
       22-10-2026 b (Bart): Versturen en de knop na het versturen zoals alle knoppen in de app, geen volle roestknop meer. Het
       logovakje wit. 22-10-2026 c (schets R2 "zoals Claude"): knoppen lichtgrijs #F0EEE6, rand 1px #8F8B80, letters #141413; inkt
       bijna zwart, accent (uitlegkader) de terra van het logo #9E543E. */
    --pine:#141413; --accent:#9E543E; --moss:#4F7A5A; --bone:#FAF9F5; --card:#FFFFFF; --line:#E8E6DC; /* 22-10-2026 c: zoals de app */
    --rood:#B4462F; --muted:#5F5B54; /* 10-10-2026 b: donkerder, beter leesbaar voor ouderen; 20-10-2026 b neutraal grijs, contrast 6,4 */ --invul:#FFFBE6; --tekst:#141413; --r:10px;
    color-scheme: light;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  body{
    background:var(--bone); color:var(--tekst);
    font-family:Inter, system-ui, -apple-system, sans-serif;
    font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  .wrap{
    max-width:560px; margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:18px;
  }
  .kopbalk{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .kopbalk img{width:78px; height:auto; display:block;}
  /* 21-10-2026 b (Bart): logo klein in een vakje met ronde hoeken, net als in de app en op de gastenpagina */
  .kopbalk .logovak{width:48px; height:48px; flex:0 0 48px; border-radius:14px; background:#FFFFFF; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .kopbalk .logovak img{width:38px;}
  .taal{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 12px;}
  .taal svg{flex:none; color:var(--pine);}
  .taal select{border:0; background:transparent; padding:6px 2px; font-size:15px; width:auto; max-width:140px; min-height:0; color:var(--tekst);} /* 30-09-2026 d: de langste optie ("Português (Portugees)") mag de kiezer niet buiten beeld duwen */
  .taal select:focus{outline:none;}
  .taal:focus-within{outline:2px solid var(--pine); outline-offset:1px;}
  header{display:flex; flex-direction:column; gap:10px;}
  h1{
    font-family:'Bricolage Grotesque', Inter, system-ui, sans-serif; font-weight:700;
    font-size:clamp(26px,7vw,34px); line-height:1.12; letter-spacing:-0.02em;
    margin:0; color:var(--pine); text-wrap:balance;
  }
  h2{font-family:'Bricolage Grotesque', Inter, system-ui, sans-serif; font-weight:700; font-size:18px; margin:0; color:var(--pine); letter-spacing:-0.01em;}
  h3{font-family:'Bricolage Grotesque', Inter, system-ui, sans-serif; font-weight:700; font-size:16px; margin:0; color:var(--pine);}
  p{margin:0;}
  .eyebrow{font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 14px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .hint{font-size:15px; color:var(--muted);}
  .legenda{font-size:14px; color:var(--muted);}
  .req{color:var(--rood); font-weight:700; margin-left:2px;}
  .uitleg{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:8px;}
  .uitleg b{color:var(--pine);}
  .uitleg ol{margin:2px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px;}
  form{display:flex; flex-direction:column; gap:18px;}
  #personen{display:flex; flex-direction:column; gap:18px;}
  .grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;}
  @media (max-width:480px){ .grid{grid-template-columns:minmax(0,1fr);} }
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field.wide{grid-column:1 / -1;}
  .field .sub{font-size:14px; color:var(--muted); font-weight:400;}
  label{font-size:16px; font-weight:600; color:var(--tekst);}
  input, select{
    font:inherit; font-size:16px; color:var(--tekst); background:var(--invul);
    border:1.5px solid #75716A; border-radius:8px; padding:11px 12px; /* 10-10-2026 b: duidelijke rand (was bijna onzichtbaar) */
    width:100%; max-width:100%; min-height:48px; display:block;
  }
  input[type=date]{-webkit-appearance:none; appearance:none;}
  input[type=date]::-webkit-date-and-time-value{text-align:left;}
  select{appearance:auto;}
  input:focus, select:focus{outline:2px solid var(--pine); outline-offset:1px; border-color:var(--moss);}
  input.filled, select.filled{border-color:var(--pine); background:var(--bone);}
  .fout-veld{border-color:var(--rood) !important; border-width:2px !important; background:#FFF1EC !important;}
  /* 10-10-2026 b: foutmelding direct boven het vakje waar het om gaat (stond alleen bovenaan de pagina, vaak buiten beeld) */
  .veldfout{color:var(--rood); background:#FFF1EC; border-left:4px solid var(--rood); border-radius:6px; padding:8px 10px; font-size:15px; font-weight:700; line-height:1.35;}
  /* 21-10-2026 d: camper langer dan de grens: meteen onder het vakje, met de WhatsApp-knop */
  .lengtemelding{display:flex; flex-direction:column; gap:10px; color:var(--rood); background:#FFF1EC; border-left:4px solid var(--rood); border-radius:6px; padding:10px 12px; font-size:15px; font-weight:700; line-height:1.35;}
  .lengtemelding[hidden]{display:none;}
  .lengtemelding a.appknop{display:block; text-align:center; background:#25D366; color:#073B1E; text-decoration:none; font-size:17px; font-weight:600; padding:15px 14px; border-radius:var(--r);}
  .zelfde1{display:flex; gap:10px; align-items:center; font-size:16px; font-weight:600; padding:10px 12px; border:1.5px solid #75716A; border-radius:8px; background:var(--bone);}
  .zelfde1 input{width:24px; height:24px; min-height:0; flex:none; margin:0; accent-color:var(--moss);}
  .mono{font-variant-numeric:tabular-nums; letter-spacing:0.03em;}
  /* 10-10-2026 a (Bart): geboortedatum als drie vakjes met cijfers, geen kalender meer waarin je tientallen jaren terug moet klikken */
  .gebrij{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr); gap:8px;}
  .gebrij label{display:flex; flex-direction:column; gap:3px; font-size:14px; font-weight:500; color:var(--muted);}
  .gebrij input{text-align:center; font-size:18px; font-variant-numeric:tabular-nums; padding:11px 6px;}
  .persoon{border-left:4px solid var(--pine);}
  .persoon h2{display:flex; align-items:center; gap:9px;}
  .persoon h2 .pklaar{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#4F7A5A;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .persoon h2 .pklaar[hidden]{display:none}
  .badge{display:inline-flex; align-items:center; justify-content:center; flex:none; width:26px; height:26px; border-radius:50%; background:var(--pine); color:#fff; font-size:13px; font-weight:700; font-family:Inter,sans-serif;}
  .knop2{align-self:stretch; text-align:center; border:1px solid var(--pine); color:var(--pine); background:var(--bone); border-radius:8px; padding:11px 12px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;}
  .knop2:focus-visible{outline:2px solid var(--pine); outline-offset:2px;}
  .sigwrap{display:flex; flex-direction:column; gap:8px;}
  .sigpad{position:relative; border:1px solid var(--line); border-radius:8px; background:var(--invul); touch-action:none; overflow:hidden; -webkit-user-select:none; user-select:none;}
  .sigpad canvas{display:block; width:100%; height:170px; touch-action:none;}
  .sigpad .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; pointer-events:none; text-align:center; padding:0 12px;}
  .sigpad.signed .ph{display:none;}
  .sigrow{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .clearbtn{background:none; border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; min-height:40px;}
  .verdict{display:flex; flex-direction:column; gap:10px; font-size:15px; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card);}
  .verdict.good{color:var(--tekst); border-color:var(--moss); border-left:4px solid var(--moss);}
  .verdict.bad{color:var(--rood); border-color:var(--rood); border-left:4px solid var(--rood);}
  .verdict b{font-weight:600;}
  .verdict a{align-self:flex-start; color:#141413; background:#F0EEE6; text-decoration:none; border-radius:8px; padding:10px 14px; font-weight:600;}
  /* na het versturen van de camperaanvraag (30-09-2026 a): grote groene WhatsApp-knop, daaronder rustig de link naar de eigen pagina */
  .verdict.klaarblok{font-size:17px; gap:14px;}
  .verdict a:not(.appknop):not(.naargast){border:1px solid #8F8B80;}
  .verdict a.appknop{align-self:stretch; text-align:center; background:#25D366; color:#073B1E; font-size:17px; padding:15px 14px; border-radius:var(--r);}
  /* 13-10-2026 a: na de check-in een duidelijke volgende stap (huisregels) met een grote knop */
  .verdict a.verderknop{align-self:stretch; text-align:center; font-size:17px; padding:15px 14px; border-radius:var(--r);}
  .verdict .stapkop{font-size:20px; font-weight:700; color:var(--moss);}
  .verdict a.naargast{align-self:center; background:none; color:var(--pine); text-decoration:underline; padding:4px;}
  .submit{background:#F0EEE6; color:#141413; border:1px solid #8F8B80; border-radius:var(--r); padding:16px; min-height:54px; width:100%; font-family:'Bricolage Grotesque', Inter, system-ui, sans-serif; font-size:17px; font-weight:700; cursor:pointer;}
  .submit:disabled{opacity:.6; cursor:default;}
  .submit:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
  details.privacy{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:0 14px;}
  details.privacy summary{cursor:pointer; padding:14px 0; font-weight:600; color:var(--pine); list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  details.privacy summary::-webkit-details-marker{display:none;}
  details.privacy summary::after{content:"+"; font-size:20px; line-height:1; color:var(--muted);}
  details.privacy[open] summary::after{content:"\2212";}
  details.privacy .inh{display:flex; flex-direction:column; gap:9px; padding-bottom:14px; font-size:14px;}
  .privregel{font-size:13.5px; color:var(--muted); text-align:center;}
  .privregel a{color:var(--pine);}
  .foot{font-size:12.5px; color:var(--muted); text-align:center;}
  /* aanvraagformulier voor campers (versie h) */
  .groot{font-size:17px; font-weight:600; color:var(--pine); background:var(--card); border:2px solid var(--pine); border-radius:var(--r); padding:14px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="kopbalk">
    <span class="logovak"><img src="logo.png" alt="Finca KaYu" width="370" height="197"></span>
    <label class="taal" for="taalKeuze">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="taalKeuze" aria-label="Taal / Language">
        <option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option>
        <option value="es">Español</option><option value="it">Italiano</option><option value="fr">Français</option><option value="pt">Português</option><option value="cs">Čeština</option><option value="fi">Suomi</option><option value="no">Norsk</option><option value="sv">Svenska</option>
      </select>
    </label>
  </div>

  <header>
    <span class="eyebrow">Finca KaYu &middot; Coín</span>
    <h1 data-t="titel"></h1>
    <p><b data-t="na"></b> <span data-t="na2"></span></p>
  </header>

  <div class="uitleg">
    <b data-t="gevraagd"></b>
    <ol><li data-t="stap1"></li><li data-t="stap2"></li><li data-t="stap3"></li></ol>
    <p class="hint" data-t="daarna" id="daarna"></p>
  </div>

  <div id="boeking" hidden></div>
  <div id="verdict" hidden role="alert"></div>

  <section class="card" id="verblijfKaart" hidden>
    <h2 data-t="aVerblijfKop"></h2>
    <div class="grid">
      <div class="field"><label for="aAankomst"><span data-t="aAankomst"></span><span class="req">*</span></label><input id="aAankomst" type="date"></div>
      <div class="field"><label for="aVertrek"><span data-t="aVertrek"></span><span class="req">*</span></label><input id="aVertrek" type="date"></div>
      <div class="field"><label for="aTijd"><span data-t="aTijd"></span><span class="req">*</span></label><select id="aTijd" data-kies><option value=""></option><option value="13:00">13:00</option><option value="14:00">14:00</option><option value="15:00">15:00</option><option value="16:00">16:00</option><option value="17:00">17:00</option><option value="18:00">18:00</option><option value="19:00">19:00</option><option value="20:00">20:00</option><option value="21:00">21:00</option><option value="22:00">22:00</option></select></div>
      <div class="field"><label for="aStroom"><span data-t="aStroom"></span><span class="req">*</span></label>
        <select id="aStroom" data-kies><option value=""></option><option value="ja" data-t="aJa"></option><option value="nee" data-t="aNee"></option></select></div>
      <div class="field"><label for="aDier"><span data-t="aDier"></span></label>
        <select id="aDier"><option value="" data-t="aDierGeen"></option><option value="Hond" data-t="aDierHond"></option><option value="Kat" data-t="aDierKat"></option><option value="Anders" data-t="aDierAnders"></option></select></div>
      <div class="field" id="aDierAantal_veld" hidden><label for="aDierAantal"><span data-t="aDierAantal"></span></label><input id="aDierAantal" type="number" min="1" max="9" value="1" inputmode="numeric"></div>
      <div class="field"><label for="aKenteken"><span data-t="aKenteken"></span><span class="req">*</span></label><input id="aKenteken" class="mono" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="200"></div>
      <div class="field"><label for="aMerk"><span data-t="aMerk"></span></label><input id="aMerk" autocomplete="off" maxlength="200"></div>
      <div class="field"><label for="aLengte"><span data-t="aLengte"></span><span class="req">*</span></label><input id="aLengte" inputmode="decimal" autocomplete="off" maxlength="200" data-ph="aLengtePh"><div id="aLengteMelding" class="lengtemelding" role="status" aria-live="polite" hidden></div></div>
    </div>
  </section>

  <section class="card" id="aantalKaart">
    <h2 id="aantalKop" data-t="aantalKop"></h2>
    <p class="hint" id="aantalHint" style="margin-top:-8px" data-t="aantalHint"></p>
    <div class="field">
      <label for="aantal" id="aantalLabel" data-t="aantalLabel"></label>
      <select id="aantal"></select>
    </div>
  </section>

  <p class="legenda" data-t="legenda"></p>

  <form id="form" novalidate>
    <h2 id="personenKop" data-t="aPersonenKop" hidden></h2>
    <p class="groot" id="allen" data-t="aAllen" hidden></p>
    <div id="personen"></div>
    <section class="card" id="hbKaart" hidden>
      <h2 data-t="aTekenKop"></h2>
      <p class="hint" style="margin-top:-6px" data-t="aTekenHint"></p>
      <div class="sigpad" id="hb_pad"><canvas id="hb_canvas"></canvas><div class="ph" data-t="tekenHier"></div></div>
      <div class="sigrow"><span class="hint" id="hb_state"></span><button type="button" class="clearbtn" id="hb_clear" data-t="wissen"></button></div>
    </section>
    <p class="privregel"><a href="#privacy" id="naarPrivacy" data-t="privKort"></a></p>
    <button class="submit" type="submit" data-t="versturen"></button>
  </form>

  <details class="privacy" id="privacy">
    <summary data-t="pKop"></summary>
    <div class="inh">
      <p data-t="pa"></p><p data-t="pb"></p><p data-t="pc"></p><p data-t="pd"></p><p data-t="pe"></p><p data-t="pf"></p><p data-t="pg"></p>
    </div>
  </details>

  <datalist id="dl_direccion"></datalist>
  <datalist id="dl_municipio"></datalist>
  <datalist id="dl_codigoPostal"></datalist>

  <p class="foot">Finca KaYu &middot; Coín, Málaga</p>
</div>

<script>
var T = {
nl: {
  alIn:"Al ingecheckt:", toevoegUitleg:"Moet er nog iemand bij? Vul hieronder alleen de nieuwe personen in. De gegevens die al binnen zijn, blijven bewaard.", allesOpnieuw:"Liever alles opnieuw invullen", aantalKopExtra:"Hoeveel personen wil je toevoegen?", aantalHintExtra:"Alleen wie er nog niet bij staat.", aantalLabelExtra:"Aantal extra personen", zelfdeAdres:"Zelfde adres en contactgegevens als {naam}", alSamen:"Jullie zijn al ingecheckt via dezelfde boeking ({kamer}). Moet er nog iemand bij? Stuur ons een WhatsApp: +34 722 162 962", fAlGemeld:"Jullie check-in is al doorgegeven aan de Spaanse overheid. Moet er nog iemand bij? Stuur ons een WhatsApp: +34 722 162 962", klaarExtra:"Toegevoegd. Nu zijn er {n} {p} ingecheckt. Je gastenpagina opent…",

  aantalKop:"Met hoeveel personen komen jullie?", aantalHint:"Hetzelfde aantal als op jullie boeking.", aantalLabel:"Aantal personen",
  p1:"persoon", pN:"personen", legenda:"Velden met een * zijn verplicht.",
  hoofdboeker:"Persoon 1 (hoofdboeker)", persoon:"Persoon", kies:"Kies…", vaak:"Veel gekozen", alle:"Alle landen",

  geboortedatum:"Geboortedatum", gebDag:"Dag", gebMaand:"Maand", gebJaar:"Jaar", klaarKop:"✓ Check-in gelukt!", klaarStap:"Nog één stap: lees onze huisregels en tik onderaan op de knop. Daarna opent je eigen gastenpagina, met de poortcode en de wifi.", klaarKnop:"Verder naar de huisregels", fNogInP:"Persoon {n}, nog invullen: {veld}", fNogIn:"Nog invullen: {veld}", zelfdeAls1:"Zelfde adres en contactgegevens als persoon 1", conceptTerug:"Wat je eerder had ingevuld, staat er nog. Je kunt verder waar je was.", fAantal:"Kies eerst met hoeveel personen jullie komen.", docHintPAS:"Het paspoortnummer staat op de pagina met je foto. Let op: niet je BSN of persoonsnummer.", docHintOTRO:"Het kaartnummer staat op de identiteitskaart zelf. Let op: niet je BSN of persoonsnummer.", docHintNIF:"Je DNI-nummer: 8 cijfers en een letter, bijvoorbeeld 12345678Z.", docHintNIE:"Je NIE-nummer begint met X, Y of Z, bijvoorbeeld X1234567L.", docSoort:"Soort document", docPAS:"Paspoort", docOTRO:"Identiteitskaart (niet Spaans)",

  docNummer:"Documentnummer", soporte:"Supportnummer van de kaart", soporteHint:"9 tekens, staat op je DNI of TIE (bijvoorbeeld ABC123456)",

  pd:"Empfänger: das spanische Innenministerium (SES Hospedajes). Die Unterschrift wird nicht weitergegeben; wir bewahren sie selbst auf, wie es das Gesetz vorschreibt.",
  pe:"Speicherdauer: 3 Jahre nach Ende eures Aufenthalts. Danach werden die Daten automatisch gelöscht.",
  pf:"Die Daten liegen in einer gesicherten Datenbank in der EU (Irland). Nur Bart und Loes von der Finca KaYu haben Zugriff. Ihr habt das Recht auf Auskunft und Berichtigung. Eine Löschung ist erst nach Ablauf der gesetzlichen Frist möglich. Beschwerden könnt ihr bei der spanischen Datenschutzbehörde einreichen (AEPD, aepd.es).",
  pg:"Was ihr eingebt, merkt sich nur euer eigenes Telefon, höchstens 3 Tage lang, damit ihr dort weitermachen könnt, wo ihr aufgehört habt. Nach dem Absenden wird es gelöscht.",
  /* versie h: aanvraagformulier en check-in voor campers (vertaald na akkoord Bart) */

r Camper länger? Dann meldet euch bitte zuerst kurz bei uns, dann schauen wir gemeinsam, was möglich ist.", fALangKnop:"Schreibt uns auf WhatsApp", fALangApp:"Hallo Bart und Loes! Unser Camper ist {lengte} Meter lang. Können wir trotzdem kommen?", fALengteFout:"Gebt die Länge in Metern an, zum Beispiel 7,5.", aKlaar:"Vielen Dank! Eure Buchung ist eingegangen und steht fest.", aAppTekst:"Hallo Bart und Loes! Unsere Angaben sind verschickt. {naam}, {data}.", aAppKnop:"Sagt Bart und Loes Bescheid, dass alles fertig ist", cNa:"Nach dem Ausfüllen ist der Check-in erledigt. Einen Tag vor der Ankunft öffnet derselbe Link eure eigene Gästeseite mit dem Torcode, dem WLAN und unseren Tipps.", cKlaar:"Check-in vollständig ({n} {p}). Vielen Dank!", cOpenen:"Einen Moment…",cPb:"Warum: um eure Buchung festzuhalten und euch bei der Ankunft zu erkennen. Rechtsgrundlage ist die Erfüllung eines Vertrags (Art. 6 Abs. 1 lit. b DSGVO).", cPd:"Empfänger: niemand. Wir geben eure Daten nicht an andere weiter."

  pb:"Por qué: la ley española (Real Decreto 933/2021) nos obliga a registrar a cada huésped y comunicarlo al Ministerio del Interior. La base jurídica es una obligación legal (art. 6.1.c RGPD), por lo que no se necesita consentimiento.",

  function maakPad(p){
    var pad = $(p + 'pad'), canvas = $(p + 'canvas'), state = $(p + 'state'), clear = $(p + 'clear');
    var ctx = canvas.getContext('2d');
    var drawing = false, ink = false, last = null, breedte = 0;
    function size(){
      var r = canvas.getBoundingClientRect();
      if (!r.width) return;
      if (Math.round(r.width) === breedte) return;  /* alleen bij echte breedteverandering, niet bij scrollen */
      breedte = Math.round(r.width);
      var dpr = window.devicePixelRatio || 1;
      var data = ink ? canvas.toDataURL() : null;
      canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2B1A12';
      if (data){ var img = new Image(); img.onload = function(){ ctx.drawImage(img,0,0,r.width,r.height); }; img.src = data; }
    }
    function pos(e){ var r = canvas.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
    canvas.addEventListener('pointerdown', function(e){
      size(); e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch(x){}
      drawing = true; last = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y); ctx.stroke();
      if (!ink){ ink = true; pad.classList.add('signed'); state.textContent = t('getekend'); pad.classList.remove('fout-veld'); var vf = pad.parentNode && pad.parentNode.querySelector('.veldfout'); if (vf) vf.parentNode.removeChild(vf); }
    });
    canvas.addEventListener('pointermove', function(e){
      if (!drawing) return; e.preventDefault();
      var q = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(q.x, q.y); ctx.stroke(); last = q;
    });
    function stop(){ drawing = false; }
    canvas.addEventListener('pointerup', stop); canvas.addEventListener('pointercancel', stop);
    clear.addEventListener('click', function(){
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
      ink = false; pad.classList.remove('signed'); state.textContent = t('nietGetekend');
    });
    window.addEventListener('resize', size);
    function herstel(data){
      if (!data) return; size();
      var r = canvas.getBoundingClientRect(), img = new Image();
      img.onload = function(){ ctx.drawImage(img,0,0,r.width,r.height); };
      img.src = data; ink = true; pad.classList.add('signed'); state.textContent = t('getekend');
    }
    return { size:size, herstel:herstel, heeftInkt:function(){ return ink; }, pad:pad,
             afbeelding:function(){ return ink ? canvas.toDataURL('image/png') : null; } };
  }

  /* 21-10-2026 e (Bart: zo veel mogelijk automatisch): SES wil bij een adres in Spanje de gemeente als INE-code (5 cijfers).
     De gast kiest die uit de officiële INE-lijst (gemeenten.txt, INE 1-1-2026, 8132 gemeenten, "code|naam"). Alleen de
     gemeenten van de provincie van de postcode (de eerste twee cijfers van een Spaanse postcode zijn de INE-provinciecode);
     is de postcode nog geen 5 cijfers, dan de hele lijst. Staat de getypte woonplaats er precies één keer in, dan staat die al
     gekozen. Alleen voor kamers en de hele finca (campers gaan nooit naar SES). */
  var GEMEENTEN = null, gemeentenBezig = false, gemeentenMislukt = false, gemeentenPogingen = 0;
  var LIDWOORD = { 'La':1, 'El':1, 'Los':1, 'Las':1, 'la':1, 'el':1, 'A':1, 'O':1, "L'":1, "l'":1, 'Les':1, 'les':1, 'Els':1, 'els':1, 'Es':1, 'As':1, 'Os':1, 'Sa':1, 'Ses':1 };
  /* INE zet het lidwoord achteraan ("Alfàs del Pi, l'"); in de lijst staat het vooraan ("l'Alfàs del Pi") */
  function gemeenteWeergave(n){
    return n.split('/').map(function(d){ var m = /^(.*), ([^,]+)$/.exec(d); return m && LIDWOORD[m[2]] ? m[2] + (/'$/.test(m[2]) ? '' : ' ') + m[1] : d; }).join('/');
  }
  function gemeenteSleutel(x){
    return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()
      .replace(/^(la|el|los|las|l|les|els|es|as|os|sa|ses|a|o) /, '');
  }
  function laadGemeenten(){
    if (GEMEENTEN || gemeentenBezig) return;
    gemeentenBezig = true; gemeentenPogingen++;
    fetch('gemeenten.txt').then(function(r){ if (!r.ok) throw new Error('status ' + r.status); return r.text(); }).then(function(txt){
      var lijst = [];
      txt.split('\n').forEach(function(regel){
        var m = /^(\d{5})\|(.+)$/.exec(regel.replace(/\r$/, '')); if (!m) return;
        var w = gemeenteWeergave(m[2]);
        lijst.push({ c: m[1], n: m[2], w: w, k: [gemeenteSleutel(w)].concat(w.split('/').map(gemeenteSleutel)) });
      });
      if (lijst.length < 8000) throw new Error('lijst onvolledig');
      var coll = new Intl.Collator('es'); lijst.sort(function(a, b){ return coll.compare(a.w, b.w) || coll.compare(a.c, b.c); }); /* op de naam zoals de gast hem ziet (l'Alfàs onder de L) */
      GEMEENTEN = lijst; gemeentenMislukt = false;

  }
  function gemeenteNodig(p){ var land = $(p + 'pais'); return !camper && !!land && land.value === 'ESP'; }

    var nodig = gemeenteNodig(p);

    vak.hidden = !nodig || (!GEMEENTEN && gemeentenMislukt);

      sel.setAttribute('data-lijst', prov);

  function lengteGetal(){
    var s = String($('aLengte').value).trim().toLowerCase(), mm = s.match(/^(\d{1,2})\s*m\s*(\d{1,2})$/), x;
    if (mm) x = parseFloat(mm[1] + '.' + mm[2]);
    else { var g = s.match(/\d+(?:[.,]\d+)?/g); if (!g || g.length !== 1) return NaN; x = parseFloat(g[0].replace(',', '.')); }
    return isFinite(x) && x > 0 && x <= 30 ? x : NaN;
  }
  /* 21-10-2026 d (Bart): campers tot de maximale lengte (instelling van de eigenaar, Finca KaYu 8 meter). Wie langer is, neemt eerst
     contact op; Bart maakt soms een uitzondering en zet die boeking dan zelf. De database (camper_aanvraag_zet) weigert het ook.
     De grens komt mee met camper_aanvraag_lees; null = geen grens. Zonder grens van de database (oudere versie): 8. */
  var maxLengte = 8, aanvraagNaam = '';
  function teLang(){ var x = lengteGetal(); return maxLengte !== null && x > maxLengte; }
  function zetMaxLengte(j){
    if (!j || !Object.prototype.hasOwnProperty.call(j, 'max_lengte')) return;
    var ml = j.max_lengte === null ? null : Number(j.max_lengte);
    if (ml === null || (isFinite(ml) && ml > 0)) maxLengte = ml;
  }
  function meter(x){ var s = String(Math.round(x * 100) / 100); return taal === 'en' ? s : s.replace('.', ','); }
  function lengteTekst(){ return t('fALang', { m: meter(maxLengte) }); }
  function lengteAppKnop(id){
    var naam = [waarde('p1_', 'nombre'), waarde('p1_', 'apellido1')].filter(Boolean).join(' ') || aanvraagNaam;
    /* de data erbij als die al zijn ingevuld (review 21-10 d: anders moet Bart ernaar vragen) */
    var inD = $('aAankomst').value, uitD = $('aVertrek').value, data = '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(inD) && /^\d{4}-\d{2}-\d{2}$/.test(uitD) && uitD > inD){
      try { var loc = taal === 'en' ? 'en-GB' : intlTaal(); data = new Intl.DateTimeFormat(loc, { day:'numeric', month:'long' }).formatRange(new Date(inD + 'T12:00:00'), new Date(uitD + 'T12:00:00')); }
      catch(e){ data = inD + ' / ' + uitD; }
    }
    var erbij = [naam, data].filter(Boolean).join(', ');
    var tekst = t('fALangApp', { lengte: meter(lengteGetal()) }) + (erbij ? ' ' + erbij : '');
    return '<a class="appknop telang" id="' + id + '" href="https://wa.me/34722162962?text=' + encodeURIComponent(tekst) + '" target="_blank" rel="noopener">' + esc(t('fALangKnop')) + '</a>';
  }
  function toonLengteMelding(){
    var m = $('aLengteMelding'); if (!m) return;
    if (!aanvraag || !teLang()){
      m.hidden = true; m.innerHTML = '';
      /* de melding bovenaan (na versturen) ook weg zodra de lengte past (review 21-10 d) */
      if (verdictBox.querySelector('a.telang')){ verdictBox.hidden = true; verdictBox.innerHTML = ''; }
      return;
    }
    m.innerHTML = '<span>' + esc(lengteTekst()) + '</span>' + lengteAppKnop('lengteAppKnop');
    m.hidden = false;
  }
  /* bij versturen: bovenaan dezelfde melding met knop, het vakje rood, en naar de melding onder het vakje */
  function toonTeLang(){
    verdictBox.hidden = false; verdictBox.className = 'verdict bad';
    verdictBox.innerHTML = '<span><b>' + esc(lengteTekst()) + '</b></span>' + lengteAppKnop('foutAppKnop');
    wisVeldFouten();
    $('aLengte').classList.add('fout-veld');
    toonLengteMelding();
    $('aLengteMelding').scrollIntoView({ behavior:'smooth', block:'center' });
  }
  /* 03-10-2026 b: samengestelde velden (naam, adres, medereizigers) nooit langer dan de database toestaat; de volledige gegevens gaan per persoon mee */
  function kort200(x){ return String(x || '').slice(0, 200).replace(/[\ud800-\udbff]$/, ''); }
  function verstuurAanvraag(n, personen){
    var p1 = personen[0], dier = $('aDier').value;
    var adres = [p1.direccion, [p1.codigo_postal, p1.municipio].filter(Boolean).join(' '), p1.pais].filter(Boolean).join(', ');
    var boekingData = {
      aankomst: $('aAankomst').value, vertrek: $('aVertrek').value, personen: n, aankomsttijd: $('aTijd').value.trim(),
      stroom: $('aStroom').value === 'ja', dier: dier, dier_aantal: dier ? Math.min(9, Math.max(1, parseInt($('aDierAantal').value, 10) || 1)) : 0,
      kenteken: $('aKenteken').value.trim().toUpperCase(), merk: $('aMerk').value.trim(), lengte: lengteGetal(),
      naam: kort200([p1.nombre, p1.apellido1, p1.apellido2].filter(Boolean).join(' ')), telefoon: p1.telefono || '', email: p1.correo || '', adres: kort200(adres),
      medereizigers: kort200(personen.slice(1).map(function(x){ return x.nombre; }).filter(Boolean).join(', '))
    };
    var knop = form.querySelector('.submit');
    knop.disabled = true; knop.textContent = t('bezig');
    /* p_akkoord: sinds 30-09-2026 a geen huisregels meer in het formulier (akkoord volgt op de gastenpagina); de database eist dit vinkje niet meer */
    rpc('camper_aanvraag_zet', { p_code: CODE, p_boeking: boekingData, p_personen: personen, p_akkoord: false }).then(function(j){
      if (!j || j.fout){
        knop.disabled = false; knop.textContent = t('versturen');
        if (j && j.fout === 'al ingevuld'){ conceptWis(); aanvraagAlIngevuld = true; toonAlIngevuld(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
        /* 03-10-2026 a, vangnet: "onvolledig" kan alleen nog door het e-mailadres komen (aankomsttijd controleert het formulier al met dezelfde regel) */
        if (j && j.fout === 'onvolledig'){ toonFoutMetApp(t('fMail', { n: nummer(1) }), $('p1_correo')); return; }
        /* 21-10-2026 d: de database weigert een te lange camper (de grens kan intussen veranderd zijn) */
        if (j && j.fout === 'te_lang'){
          rpc('camper_aanvraag_lees', { p_code: CODE }).then(zetMaxLengte).catch(function(){}).then(function(){ if (teLang()) toonTeLang(); else toonOpslaanFout(); });
          return;
        }
        if (j && j.fout === 'onbekend') toonFoutMetApp(t('fLink')); else if (j && j.fout === 'datums') toonFoutMetApp(t('fADatums'), $('aAankomst')); else if (j && j.fout === 'tekens') toonFoutMetApp(t('fATekens')); else toonOpslaanFout();
        return;
      }
      /* 30-09-2026 a (Bart): geen automatische doorsturing meer; de gast kan Bart en Loes met één tik een appje sturen */
      conceptWis();
      aanvraagKlaar = { naam: boekingData.naam, aankomst: boekingData.aankomst, vertrek: boekingData.vertrek };
      toonAanvraagKlaar();
      window.scrollTo({ top:0, behavior:'smooth' });
    }).catch(function(){ knop.disabled = false; knop.textContent = t('versturen'); toonOpslaanFout(); });
  }
  function zetCamperVelden(){
    $('verblijfKaart').hidden = !aanvraag; $('hbKaart').hidden = !aanvraag;
    $('personenKop').hidden = !aanvraag; $('allen').hidden = !aanvraag;
    document.querySelectorAll('[data-t="na2"], [data-t="daarna"]').forEach(function(el){ el.hidden = camper; });
    if (aanvraag && hbPad) hbPad.size();
  }
  if (aanvraag){
    $('aAankomst').min = vandaagIso(); $('aVertrek').min = vandaagIso(); $('aAankomst').max = plusDagen(vandaagIso(), 365);
    $('aDier').addEventListener('change', function(){ $('aDierAantal_veld').hidden = !this.value; });
    $('aLengte').addEventListener('input', toonLengteMelding);
    $('aLengte').addEventListener('change', toonLengteMelding); /* ook na het terugzetten van een bewaard formulier */
    /* het klaargezette appje bijwerken als de data of de naam later nog veranderen (review 21-10 d) */
    $('aAankomst').addEventListener('change', toonLengteMelding); $('aVertrek').addEventListener('change', toonLengteMelding);
    houder.addEventListener('change', function(e){ if (e.target && /^p1_(nombre|apellido1)$/.test(e.target.id || '')) toonLengteMelding(); });
    $('aAankomst').addEventListener('change', function(){
      var a = this.value; if (a && (!$('aVertrek').value || $('aVertrek').value <= a)){ $('aVertrek').value = plusDagen(a, 1); }
      for (var i = 1; i <= (parseInt(aantalSel.value, 10) || 1); i++) pasAan('p' + i + '_');
    });
    hbPad = maakPad('hb_');
    /* stap 2 (verzoek Bart): eerst de uitleg, dan het aantal personen, dan de personen */
    form.insertBefore($('aantalKaart'), houder);
  }

  $('naarPrivacy').addEventListener('click', function(e){ e.preventDefault(); var d = $('privacy'); d.open = true; d.scrollIntoView({ behavior:'smooth', block:'start' }); });

  /* ---------- start ---------- */
  taal = startTaal();
  vulAantal();
  bouw();
  if (CODE && aanvraag){
    rpc('camper_aanvraag_lees', { p_code: CODE }).then(function(j){
      if (!j || j.fout){ boekingStatus = 'ongeldig'; form.querySelector('.submit').disabled = true; toonBoeking(); return; }
      if (j.status !== 'open'){ location.replace('./?ontbijt=' + encodeURIComponent(CODE)); return; }
      boekingStatus = 'aanvraag';
      zetMaxLengte(j);
      aanvraagNaam = typeof j.naam === 'string' ? j.naam : '';
      var eigenKeuze = false; try { eigenKeuze = !!localStorage.getItem('ontbijtTaal'); } catch(e){}
      if (!eigenKeuze && j.taal && TALEN.indexOf(j.taal) >= 0 && !(j.taal === 'en' && (taal === 'fi' || taal === 'no' || taal === 'sv'))) taal = j.taal; /* 30-09-2026 b: Finse gasten krijgen via Bart een Engelse link (Fins bestaat niet in de berichten); staat hun telefoon op Fins, dan de pagina in het Fins */
      vertaal();
      conceptHerstel();
    }).catch(function(){ boekingStatus = 'fout'; toonBoeking(); });
  } else if (CODE){
    rpc('gast_checkin_lees', { p_code: CODE }).then(function(j){
      if (!j || j.fout){ boekingStatus = 'ongeldig'; form.querySelector('.submit').disabled = true; toonBoeking(); return; }
      boeking = j; boekingStatus = 'ok';
      camper = !/^Kamer /.test(String(j.kamer || '')) && j.kamer !== 'Hele finca';
      var eigenKeuze = false; try { eigenKeuze = !!localStorage.getItem('ontbijtTaal'); } catch(e){}
      if (!eigenKeuze && j.taal && TALEN.indexOf(j.taal) >= 0 && !(j.taal === 'en' && (taal === 'fi' || taal === 'no' || taal === 'sv'))) taal = j.taal; /* 30-09-2026 b: Finse gasten krijgen via Bart een Engelse link (Fins bestaat niet in de berichten); staat hun telefoon op Fins, dan de pagina in het Fins */
      if (j.aantal_ingevuld > 0 && (GEMELD.indexOf(j.status) >= 0 || j.samen_met)){ zetModus('dicht'); } /* 16-10-2026 a: samen_met = ingecheckt via een andere kamer */
      else if (j.aantal_ingevuld > 0){ zetModus('erbij'); aantalSel.value = '1'; }
      else if (j.aantal_opgegeven && j.aantal_opgegeven >= 1 && j.aantal_opgegeven <= 20) aantalSel.value = String(j.aantal_opgegeven);
      bouw();
      conceptHerstel();
    }).catch(function(){ boekingStatus = 'fout'; toonBoeking(); });
  }
})();

</script>
